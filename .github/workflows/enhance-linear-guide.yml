name: Enhance Linear Guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-linear-guide.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add copy and temporary edit controls
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('linear-github-ai-guide.html')
          s = p.read_text(encoding='utf-8')

          marker = 'data-command-tools="v1"'
          if marker in s:
              print('Command tools already installed; no changes needed.')
              raise SystemExit(0)

          css = r'''
          /* Interactive command tools */
          .guide-top-nav{position:sticky;top:0;z-index:9999;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(24,59,86,.06);backdrop-filter:blur(10px)}
          .guide-top-nav__inner{max-width:1160px;margin:auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
          .guide-top-nav__title{font-size:.88rem;color:var(--muted);font-weight:700}.guide-top-nav__link{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:#fff!important;text-decoration:none!important;padding:7px 12px;border-radius:9px;font-weight:700}
          .command{position:relative}.command .command-text{display:block;min-height:1.9em;outline:none;border-radius:8px}.command .command-text[contenteditable="true"]{background:#fff8dc!important;box-shadow:0 0 0 2px #e0bd59 inset;padding:8px;cursor:text}
          .command-toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-start;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
          .command-btn{border:1px solid #d8e1e6;background:#fff;color:var(--navy);border-radius:8px;padding:6px 10px;font-family:"Cairo",sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s}.command-btn:hover,.command-btn:focus{background:#eef5f7;border-color:#b9ccd6}.command-btn.primary{background:var(--green);border-color:var(--green);color:#fff}.command-btn.primary:hover,.command-btn.primary:focus{filter:brightness(.94)}.command-btn.cancel{display:none;color:#8a4f15}.command.is-editing .command-btn.cancel{display:inline-block}.command-hint{font-size:.76rem;color:var(--muted);margin-top:5px}
          .copy-toast{position:fixed;left:18px;bottom:18px;z-index:10000;background:#17212b;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;font:700 .85rem "Cairo",sans-serif}.copy-toast.show{opacity:1;transform:translateY(0)}
          @media(max-width:600px){.guide-top-nav__inner{flex-direction:column;align-items:stretch}.guide-top-nav__link{text-align:center}.command-toolbar{display:grid;grid-template-columns:1fr 1fr}.command-btn.cancel{grid-column:1/-1}}
          @media print{.guide-top-nav,.command-toolbar,.command-hint,.copy-toast{display:none!important}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)

          nav = r'''<nav class="guide-top-nav" aria-label="التنقل العام" data-command-tools="v1"><div class="guide-top-nav__inner"><span class="guide-top-nav__title">دليل Linear وGitHub وChatGPT / Codex</span><a class="guide-top-nav__link" href="./index.html">⌂ فهرس الأدلة</a></div></nav>'''
          s = s.replace('<body>', '<body>\n' + nav, 1)

          section = '<section id="commands-linear"><h2>9. أوامر جاهزة لـChatGPT/Codex على Linear</h2>'
          note = '<div class="callout"><b>أدوات الأوامر:</b> استخدم <b>نسخ</b> لنسخ الأمر كما هو، أو <b>تعديل ونسخ</b> لتغيير اسم مشروع أو Issue أو ملف مؤقتًا. التعديل لا يُحفظ، ويعود النص الأصلي بعد النسخ أو تحديث الصفحة.</div>'
          if section in s:
              s = s.replace(section, section + note, 1)

          js = r'''<script>
          (function(){
            const commands=document.querySelectorAll('.command');
            const toast=document.createElement('div');toast.className='copy-toast';toast.setAttribute('role','status');document.body.appendChild(toast);let timer;
            function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}
            async function copy(t){try{await navigator.clipboard.writeText(t);msg('تم النسخ');return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();msg(ok?'تم النسخ':'تعذر النسخ');return ok}}
            commands.forEach(card=>{const code=card.querySelector('code');if(!code)return;code.classList.add('command-text');code.dataset.original=code.textContent.trim();
              const bar=document.createElement('div');bar.className='command-toolbar';
              const c=document.createElement('button');c.type='button';c.className='command-btn';c.textContent='نسخ';
              const e=document.createElement('button');e.type='button';e.className='command-btn primary';e.textContent='تعديل ونسخ';
              const x=document.createElement('button');x.type='button';x.className='command-btn cancel';x.textContent='إلغاء التعديل';
              const h=document.createElement('div');h.className='command-hint';h.textContent='التعديل مؤقت داخل الصفحة فقط ولا يتم حفظه.';bar.append(c,e,x);card.append(bar,h);
              function reset(){code.textContent=code.dataset.original;code.contentEditable='false';code.removeAttribute('spellcheck');card.classList.remove('is-editing');e.textContent='تعديل ونسخ'}
              c.addEventListener('click',()=>copy(code.textContent.trim()));
              e.addEventListener('click',async()=>{if(!card.classList.contains('is-editing')){card.classList.add('is-editing');code.contentEditable='true';code.spellcheck=false;e.textContent='نسخ المعدّل';code.focus();const r=document.createRange();r.selectNodeContents(code);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}else{await copy(code.textContent.trim());reset()}});
              x.addEventListener('click',reset);code.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&card.classList.contains('is-editing'))reset()});
            });
          })();
          </script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit enhanced guide
        run: |
          if git diff --quiet -- linear-github-ai-guide.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linear-github-ai-guide.html
          git commit -m "docs: add copy and temporary edit controls to Linear guide"
          git push
